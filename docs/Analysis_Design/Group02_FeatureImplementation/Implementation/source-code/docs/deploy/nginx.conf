# TixHub — Nginx config for the single VPS behind Cloudflare (ADR 0003 / ADR 0004).
#
# Topology (split origin, Cloudflare SSL mode = Flexible):
#
#   browser --HTTPS--> Cloudflare edge --HTTP--> nginx:80 --HTTP--> node:4000
#
#   https://tixhub.fit       static SPA (vite build → dist/)
#   https://api.tixhub.fit   Express + Socket.IO on 127.0.0.1:4000
#
# THREE things about Flexible mode that differ from a normal TLS setup, all load-bearing:
#
#  1. nginx has NO certificate and does NOT listen on 443. Cloudflare terminates TLS at
#     the edge and speaks plain HTTP to the origin.
#  2. NEVER add `return 301 https://$host$request_uri` here. The request arriving from
#     Cloudflare is already http:// at the origin, so the redirect sends the browser back
#     to https:// → CF → origin → 301 again, forever (ERR_TOO_MANY_REDIRECTS). Force
#     HTTPS in the Cloudflare dashboard instead (SSL/TLS → Edge Certificates → "Always
#     Use HTTPS"), which redirects at the edge where the scheme is actually https.
#  3. X-Forwarded-Proto must be taken from Cloudflare's header, not from $scheme.
#     $scheme is "http" at the origin, and passing that would tell Express the request
#     was insecure.
#
# Flexible leaves CF→origin traffic unencrypted. Upgrading to Full (strict) is one
# Origin Certificate away and is the better end state — see the block at the bottom.
#
# ---------------------------------------------------------------------------
# Cloudflare is hop 1 of 2 — this is why real_ip below is mandatory, not polish
# ---------------------------------------------------------------------------
# ADR 0003 assumed ONE proxy hop and wrote `X-Forwarded-For $remote_addr` on that
# basis. With Cloudflare in front there are two hops, and $remote_addr is now the
# Cloudflare edge IP, not the visitor. Passing it through would make every visitor
# sharing a Cloudflare colo collapse into ONE throttle bucket
# (server/src/modules/auth/throttle.ts `ipKey`) — a global rate limit that one
# noisy user can exhaust for a whole region.
#
# `real_ip_header CF-Connecting-IP` + `set_real_ip_from <CF ranges>` rewrites
# $remote_addr to the true visitor IP before proxy_set_header runs, so the
# `X-Forwarded-For $remote_addr` overwrite from ADR 0003 stays correct as written and
# `trust proxy = 1` in server/src/app.ts needs no change. The overwrite (not
# $proxy_add_x_forwarded_for) is still deliberate: appending would let a client
# prepend a forged IP and spoof the throttle.
#
# set_real_ip_from is what makes CF-Connecting-IP trustworthy — nginx honours the
# header ONLY from those addresses. Without the list, anyone hitting the origin IP
# directly could set CF-Connecting-IP themselves and forge their source IP.

# ---------------------------------------------------------------------------
# http {} block — put these OUTSIDE any server block
# ---------------------------------------------------------------------------

# Socket.IO's WebSocket upgrade (feature 003 live seat channel). Without this map and
# the two proxy_set_headers below, the upgrade fails and socket.io-client silently
# falls back to HTTP long-polling: the seat map still works but every viewer polls.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# X-Forwarded-Proto source: prefer Cloudflare's header ("https"), fall back to $scheme.
# Under Flexible $scheme is "http" at the origin, so passing it would tell Express the
# request was insecure. The fallback keeps this correct if the mode is later switched to
# Full (strict), where $scheme is already https.
map $http_x_forwarded_proto $cf_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Cloudflare IPv4 — https://www.cloudflare.com/ips-v4  (verify before deploying; CF adds ranges)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare IPv6 — https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ---------------------------------------------------------------------------
# api.tixhub.fit — Express + Socket.IO
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.tixhub.fit;

    # No `return 301 https` — see note 2 at the top. Cloudflare "Always Use HTTPS"
    # handles the redirect at the edge.

    # Avatar uploads are capped at 2 MB by multer (server/src/modules/auth/auth.routes.ts).
    # nginx's default client_max_body_size is 1 MB, so a 1.5 MB avatar would be rejected
    # here with a 413 and never reach the app's own validation. Headroom for multipart
    # overhead. (Cloudflare's own upload cap on the Free plan is 100 MB — not the binding
    # limit, but it is a second ceiling that exists.)
    client_max_body_size 3m;

    # Everything is proxied, not just /api/: the SPA also fetches
    # https://api.tixhub.fit/uploads/avatars/<uuid>.webp (see src/services/api.ts
    # apiAssetUrl, which prefixes the stored root-relative path with the API origin)
    # and connects to https://api.tixhub.fit/socket.io/. A `location /api/` alone
    # would 404 both.
    location / {
        proxy_pass http://127.0.0.1:4000;

        # WebSocket upgrade for Socket.IO. HTTP/1.1 is required — the default 1.0
        # cannot carry an Upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        # OVERWRITE with the real visitor IP (real_ip rewrote $remote_addr above),
        # NOT $proxy_add_x_forwarded_for, which appends a client-settable value and
        # would let the throttle be spoofed — ADR 0003's recorded footgun.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Cloudflare's value ("https"), not $scheme ("http" at the origin under Flexible)
        # — see the $cf_proto map in the http {} block above.
        proxy_set_header X-Forwarded-Proto $cf_proto;

        # A WebSocket carrying seat updates is idle between events; the 60s default
        # would drop it and force a reconnect loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# tixhub.fit — static SPA only. No /api proxy: the browser calls api.tixhub.fit
# directly (src/services/api.ts API_ORIGIN).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tixhub.fit www.tixhub.fit;

    root /var/www/tixhub/dist;
    index index.html;

    # Vite fingerprints bundle filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is what points at the current bundle hashes.
    # A cached copy keeps returning users on a deleted bundle after the next deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Upgrading to Full (strict) — recommended
# ---------------------------------------------------------------------------
# Flexible mode leaves the Cloudflare→VPS leg in plaintext. Anything on the path
# between the edge and the origin sees session cookies and passwords in the clear,
# which is the exact exposure SEC-01 exists to close. Fixing it:
#
#   1. Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate.
#      Save the cert and key to the VPS (key mode 600, root-owned).
#   2. Switch SSL/TLS → Overview → Full (strict).
#   3. In each server block above:
#        - replace `listen 80;` with `listen 443 ssl; http2 on;`
#        - add:  ssl_certificate     /etc/ssl/cloudflare/tixhub.fit.pem;
#                ssl_certificate_key /etc/ssl/cloudflare/tixhub.fit.key;
#        - add a separate port-80 server that returns 301 to https (safe once the
#          origin actually speaks TLS — no loop, because the origin scheme is now https)
#   4. Both maps stay as they are; $cf_proto resolves to $scheme = https.
#
# The firewall stays either way: Cloudflare only protects requests that go THROUGH
# Cloudflare. Allow :80/:443 from the CF ranges above and nowhere else, or the origin
# IP is a direct route past the WAF, the rate limiting, and the DDoS absorption. With
# Full (strict) the origin certificate also refuses non-CF TLS clients.
