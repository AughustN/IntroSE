# TixHub — sample Nginx config for the single VPS (ADR 0003 / ADR 0004).
# Same-origin: Nginx serves the built SPA and reverse-proxies /api to the Node backend.
# TLS is team-managed (Let's Encrypt / certbot) — SEC-01.

server {
    listen 80;
    server_name tixhub.fit;
    return 301 https://$host$request_uri;   # force HTTPS
}

server {
    listen 443 ssl http2;
    server_name tixhub.fit;

    ssl_certificate     /etc/letsencrypt/live/tixhub.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tixhub.fit/privkey.pem;

    # Built SPA (vite build → dist/)
    root /var/www/tixhub/dist;
    index index.html;

    # API → Node backend on :4000. OVERWRITE X-Forwarded-For with the real client IP
    # ($remote_addr), NOT $proxy_add_x_forwarded_for (which appends a client-settable
    # value and would let the throttle be spoofed — see ADR 0003). Backend runs
    # `app.set('trust proxy', 1)`.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded avatars — static, never executed; nosniff (ADR 0004).
    location /uploads/ {
        alias /var/www/tixhub/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        expires 7d;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
