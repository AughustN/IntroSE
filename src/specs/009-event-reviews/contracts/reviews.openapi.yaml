openapi: 3.1.0
info:
  title: TixHub Event Reviews & Ratings
  version: 1.0.0
  description: >
    UC-18 (rate & review) and the review half of UC-39 (report). Reading is public; writing needs a
    session and a paid ticket to the event — started or not — re-derived on the server for every
    write. Review bodies are plain text in both directions — never markup, never escaped in
    storage; the renderer encodes at the boundary.

servers:
  - url: /api

paths:
  /events/{eventId}/reviews:
    get:
      operationId: listReviews
      summary: Reviews for an event, newest first
      description: >
        Public: a rating exists to inform the next buyer, so it cannot require an account to read.
        Keyset-paginated on `createdAt` rather than by offset, so a review posted mid-scroll cannot
        shift the page boundary and make the reader see one twice or miss one.
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
        - name: before
          in: query
          description: Return reviews older than this instant. Omit for the newest page.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of reviews and the event's summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "404":
          description: No such publicly visible event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      operationId: submitReview
      summary: Post a comment on an event, or a reply under one
      description: >
        One entry point for three writes, told apart by what the caller already has. With no
        `parentId`: the caller's first comment about this event must carry `rating` and casts their
        one vote; every later comment must carry `body` and is stored without stars, whatever
        `rating` the request sends. With `parentId`: a reply, text only, flattened onto the
        top-level comment if it aimed at another reply. One *rating* per person per event is held by
        a partial unique index, so two simultaneous first comments cannot both be rated.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The stored review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400":
          description: >
            No rating on a first comment, no text on a later comment or a reply, an out-of-range
            rating, or a body over the length limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >
            Not eligible: no paid, non-void ticket to this event. `code` is `no_ticket`. Replies are
            gated the same way. Whether the event has started is not part of the rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                noTicket:
                  value: { code: no_ticket, message: Bạn cần có vé đã thanh toán cho sự kiện này để đánh giá. }
        "404":
          description: "`parentId` names no visible comment on this event."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reviews/{id}/replies:
    get:
      operationId: listReplies
      summary: The rest of one comment's thread
      description: >
        Public, like the listing it continues. Oldest first, keyset-paged on the last reply's **id**
        — not its timestamp, which the JSON carries at millisecond precision against a
        microsecond-precision column and so cannot address a row exactly. 404 if the comment is
        missing or hidden, so a removed comment does not hand out its thread through a second door.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: after
          in: query
          description: Id of the last reply already on screen. Omit for the start of the thread.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: A batch of replies.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [replies, hasMore]
                properties:
                  replies:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
                  hasMore: { type: boolean }
        "404":
          description: No such visible comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reviews/{id}:
    patch:
      operationId: editReview
      summary: Change your own review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: The updated review, with `edited` now true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            No such review *belonging to this caller*. Someone else's review answers 404 rather than
            403, so probing ids discloses nothing about what exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      operationId: deleteReview
      summary: Withdraw your own review
      description: >
        Removes the row. Withdrawal is the author taking back their own words, so unlike a
        moderation removal it leaves no hidden copy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Withdrawn. The event's average and count are recalculated without it. }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such review belonging to this caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reviews/{id}/report:
    post:
      operationId: reportReview
      summary: Report a review to the moderation queue
      description: Writes to the existing `content_reports` queue with `target_type = 'review'` (UC-39).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: Report recorded. }
        "200":
          description: Already reported by this reader. Not an error, and no duplicate is created.
          content:
            application/json:
              schema:
                type: object
                required: [alreadyReported]
                properties:
                  alreadyReported: { type: boolean, const: true }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such visible review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/reviews/{id}:
    delete:
      operationId: removeReviewAsAdmin
      summary: Remove a review (moderation)
      description: >
        Hides rather than erases: the moderation record and the audit row must keep a subject that
        can still be read. The review stops appearing and stops counting toward the average.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Removed and audited. }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

  schemas:
    ReviewInput:
      type: object
      additionalProperties: false
      description: >
        Which fields are required depends on rows the server already holds, so nothing here is
        required by the schema alone: stars on a first comment, text on every later comment and on
        every reply. `parentId` is accepted on POST only — an edit changes what a comment says,
        never what it is.
      properties:
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: >
            Whole stars, and one vote per person per event. Required on the author's first comment
            about an event; ignored (stored as null) on every one after it and on every reply.
        body:
          type: [string, "null"]
          maxLength: 2000
          description: >
            Sent and stored as the characters the author typed; whitespace-only is treated as
            absent. Never contains markup, because it is never rendered as any.
        parentId:
          type: [integer, "null"]
          format: int64
          description: >
            Post as a reply under this comment. Aimed at a reply, it is flattened onto the top-level
            comment they are both under — threads are one level deep.

    Review:
      type: object
      additionalProperties: false
      required: [id, eventId, rating, body, parentId, author, createdAt, edited]
      properties:
        id: { type: integer, format: int64 }
        eventId: { type: integer, format: int64 }
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Null on a later comment and on every reply — only the first one carries the vote.
        body: { type: [string, "null"] }
        parentId:
          type: [integer, "null"]
          format: int64
          description: The comment this answers, or null for one on the wall itself.
        replyCount:
          type: integer
          minimum: 0
          description: >
            Visible replies to this comment. Present on a listing's top-level comments. The replies
            themselves never travel with a listing — the wall is comments, and a thread is opened by
            the reader who wants it through `GET /reviews/{id}/replies`.
        author:
          oneOf:
            - $ref: "#/components/schemas/ReviewAuthor"
            - type: "null"
          description: Null when the account has been deleted; the review itself survives (FR-016).
        createdAt: { type: string, format: date-time }
        edited:
          type: boolean
          description: Derived from `updatedAt > createdAt`, so it cannot fall out of step with the row.
        mine:
          type: boolean
          description: Present only for a signed-in reader; true on their own review.

    ReviewAuthor:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname: { type: string }
        avatarUrl: { type: [string, "null"] }

    ReviewSummary:
      type: object
      additionalProperties: false
      required: [rating, reviewCount, commentCount]
      properties:
        rating:
          type: [number, "null"]
          description: Mean of visible ratings. **Null when there are none** — an unrated event is not a zero-star one.
        reviewCount:
          type: integer
          minimum: 0
          description: How many people rated it — rated comments only, so it counts votes and not talk.
        commentCount:
          type: integer
          minimum: 0
          description: Everything visible on the wall, replies included.
        distribution:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: integer, minimum: 0 }
          description: >
            How the votes fell, as `[1★, 2★, 3★, 4★, 5★]`, summing to `reviewCount`. The mean alone
            cannot tell a divided audience from an indifferent one.

    ReviewPage:
      type: object
      additionalProperties: false
      required: [summary, reviews, hasMore]
      properties:
        summary: { $ref: "#/components/schemas/ReviewSummary" }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        hasMore:
          type: boolean
          description: Whether another page exists older than the last item returned.
        viewer:
          $ref: "#/components/schemas/ViewerState"

    ViewerState:
      type: object
      additionalProperties: false
      description: >
        Present only for a signed-in reader. Returned with the listing so the page can decide in one
        call whether to show the box and what shape it takes.
      required: [canReview, hasRated]
      properties:
        canReview: { type: boolean }
        reason:
          type: [string, "null"]
          enum: [no_ticket, null]
          description: Why `canReview` is false. The interface omits the form rather than printing this.
        hasRated:
          type: boolean
          description: >
            Their stars are already cast, so the box asks for text alone and the next comment is
            stored without a rating.

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
